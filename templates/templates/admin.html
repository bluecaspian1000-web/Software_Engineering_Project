<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت دانشگاه</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="admin-container">
        <div class="admin-panel">
            <h2>پنل مدیریت</h2>
            <div class="panel-menu">
                <button id="lessonsBtn" data-action="add-course">درس‌ها</button>
                <button id="addUserBtn" data-action="add-user">اضافه کردن کاربر</button>
                <button id="viewUsersBtn" data-action="view-users">مشاهده کاربران</button>
                <button id="viewLessonsBtn" data-action="view-courses">مشاهده لیست دروس</button>
            </div>
        </div>

        <div class="main-content">
            <!-- بخش اضافه کردن درس -->
            <div id="add-course-section" class="page hidden">
                <h3>اضافه کردن درس</h3>
                <div class="form-group">
                    <label>واحد درس</label>
                    <select id="course-unit">
                        <option value="1-2">1 - واحد 2</option>
                        <option value="3">3 واحد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نام درس</label>
                    <input type="text" id="course-name">
                </div>
                <div class="form-group">
                    <label>انتخاب استاد</label>
                    <select id="course-teacher"></select>
                </div>
                <div id="course-times-container"></div>
                <button class="btn" id="add-course-btn">اضافه کردن درس</button>
                <p class="error-message" id="course-error"></p>
            </div>

            <!-- بخش اضافه کردن کاربر -->
            <div id="add-user-section" class="page hidden">
                <h3>اضافه کردن کاربر</h3>
                <div class="form-group">
                    <label>نقش کاربر</label>
                    <select id="user-role">
                        <option value="student">دانشجو</option>
                        <option value="teacher">استاد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نام</label>
                    <input type="text" id="user-name">
                </div>
                <div class="form-group">
                    <label>نام خانوادگی</label>
                    <input type="text" id="user-family">
                </div>
                <div class="form-group">
                    <label>شماره دانشجویی / کد پرسنلی</label>
                    <input type="text" id="user-id">
                </div>
                <div class="form-group">
                    <label>کد ملی</label>
                    <input type="text" id="user-code">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="user-pass">
                </div>
                <div class="form-group">
                    <label>ایمیل (اختیاری)</label>
                    <input type="email" id="user-email">
                </div>
                <button class="btn" id="add-user-btn">اضافه کردن کاربر</button>
                <p class="error-message" id="user-error"></p>
            </div>

            <!-- بخش لیست دروس -->
            <div id="course-list-section" class="page hidden">
                <h3>لیست دروس</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>نام درس</th>
                                <th>نام استاد</th>
                                <th>کد درس</th>
                                <th>کلاس</th>
                                <th>روز هفته</th>
                                <th>تایم کلاس</th>
                            </tr>
                        </thead>
                        <tbody id="courses-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- بخش لیست کاربران -->
            <div id="user-list-section" class="page hidden">
                <h3>لیست کاربران</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>نام</th>
                                <th>نام خانوادگی</th>
                                <th>شماره دانشجویی / کد پرسنلی</th>
                                <th>کد ملی</th>
                                <th>ایمیل</th>
                                <th>نقش</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
